<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Last Convoy</title>
<style>
  :root{--amber:#ffb347;--ink:#0b0d12}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#e8eef8}
  #wrap{position:fixed;inset:0;display:grid;place-items:center}
  canvas{width:100%;height:100%;display:block;touch-action:none}
  .hud{position:fixed;left:12px;top:10px;font-size:11px;letter-spacing:2px;color:#9fb0c6;pointer-events:none}
  .hud b{color:var(--amber)}
  .hud .bar{width:120px;height:5px;border-radius:3px;background:#1a2130;margin-top:4px;overflow:hidden}
  .hud .bar i{display:block;height:100%;background:var(--amber);transition:width .15s}
  .center{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:20px}
  .card{max-width:420px;background:rgba(10,13,19,.92);border:1px solid rgba(255,179,71,.35);
    border-radius:12px;padding:18px 20px}
  .card h1{margin:0 0 6px;font-size:20px;letter-spacing:4px;color:var(--amber)}
  .card p{margin:0 0 12px;font-size:11px;line-height:1.7;letter-spacing:1px;color:#93a1b5}
  .card button{font:inherit;font-size:11px;letter-spacing:2px;font-weight:700;padding:10px 18px;border-radius:8px;
    background:var(--amber);color:#1a1004;border:0;cursor:pointer}
  .card kbd{background:#1a2130;border-radius:4px;padding:1px 5px;color:#cfe0f5;font-size:10px}
  .hidden{display:none}
  @media (max-width:620px){.card h1{font-size:16px;letter-spacing:2px}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div class="hud">
  <div>CONVOY <b id="hp">100%</b></div>
  <div class="bar"><i id="hpbar" style="width:100%"></i></div>
  <div style="margin-top:6px">DIST <b id="dist">0.0</b> KM</div>
  <div>KILLS <b id="kills">0</b></div>
</div>
<div class="center" id="intro">
  <div class="card">
    <h1>LAST CONVOY</h1>
    <p>Keep the fuel truck alive to the end of Route 9.<br />
      <kbd>WASD</kbd>/<kbd>arrows</kbd> drive · <kbd>space</kbd> fire · touch: drag left, tap right.
      <br />The truck cannot stop. Neither can the road.</p>
    <button id="go">ROLL OUT</button>
  </div>
</div>
<div class="center hidden" id="over">
  <div class="card">
    <h1 id="overTitle">CONVOY LOST</h1>
    <p id="overText"></p>
    <button id="again">RUN IT AGAIN</button>
  </div>
</div>
<script src="../_shared/sdk.js"></script>
<script src="game.js"></script>
</body>
</html>
