<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>My Game</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d12;color:#e8eef8;overflow:hidden;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  canvas{width:100%;height:100%;display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<!-- Pin the base: hosts that clean URLs (Vercel) serve this page as
     `/games/my-game` with no trailing slash, and a relative `game.js` would then
     resolve to `/games/game.js` and 404. Copy this block as-is. -->
<script>
  (function pinBase() {
    var dir = location.pathname.replace(/\/index\.html?$/i, '/');
    if (dir.slice(-1) !== '/') dir += '/';
    document.write('<base href="' + dir + '">');
  })();
</script>
<script src="../_shared/sdk.js"></script>
<script src="game.js"></script>
</body>
</html>
